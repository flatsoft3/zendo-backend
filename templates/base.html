<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f4f4f4;
            padding: 2rem 1rem;
            font-family: Arial, sans-serif;
        }

        .email-outer {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
        }

        .email-header {
            background: #1D3557;
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .email-logo-mark {
            width: 36px;
            height: 36px;
            background: #F97316;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .email-logo-mark span {
            color: #fff;
            font-weight: 700;
            font-size: 18px;
        }

        .email-brand {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .email-body {
            padding: 2rem 2rem 1.5rem;
        }

        .email-greeting {
            font-size: 15px;
            color: #293241;
            margin: 0 0 1rem;
        }

        .email-heading {
            font-size: 22px;
            font-weight: 700;
            color: #1D3557;
            margin: 0 0 1rem;
            line-height: 1.3;
        }

        .email-text {
            font-size: 15px;
            color: #293241;
            line-height: 1.7;
            margin: 0 0 1.25rem;
        }

        .email-divider {
            border: none;
            border-top: 1px solid #e8e8e8;
            margin: 1.5rem 0;
        }

        .email-info-box {
            background: #f8f9fb;
            border-left: 3px solid #F97316;
            border-radius: 0 4px 4px 0;
            padding: 1rem 1.25rem;
            margin: 0 0 1.5rem;
        }

        .email-info-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            padding: 4px 0;
        }

        .email-info-label {
            color: #6b7280;
        }

        .email-info-value {
            color: #293241;
            font-weight: 600;
        }

        .email-cta-wrap {
            text-align: center;
            margin: 1.75rem 0;
        }

        .email-cta {
            display: inline-block;
            background: #F97316;
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            padding: 12px 32px;
            border-radius: 6px;
            letter-spacing: 0.3px;
        }

        .email-note {
            font-size: 13px;
            color: #6b7280;
            line-height: 1.6;
            margin: 0 0 1rem;
        }

        .email-note a {
            color: #F97316;
            text-decoration: none;
        }

        .email-footer {
            background: #1D3557;
            padding: 1.25rem 2rem;
            text-align: center;
        }

        .email-footer p {
            font-size: 12px;
            color: #94a3b8;
            margin: 0 0 4px;
            line-height: 1.6;
        }

        .email-footer a {
            color: #F97316;
            text-decoration: none;
        }

        .email-social {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 12px;
        }

        .email-social a {
            font-size: 12px;
            color: #94a3b8;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class='email-outer'>

        <!-- HEADER -->
        <div class='email-header'>
            <div class='email-logo-mark'><span>Z</span></div>
            <span class='email-brand'>Zendo</span>
        </div>

        <!-- BODY -->
        <div class='email-body'>
            {% block content %}{% endblock %}

            <hr class='email-divider'>

            <!-- FOOTER NOTES -->
            <p class='email-note'>
                If you have any concerns, please kindly contact
                our support team immediately at
                <a href='mailto:support@zendo.ng'>support@zendo.ng</a>.
            </p>

            <p class='email-note'>
                Best regards
            </p>
        </div>

        <!-- FOOTER -->
        <div class='email-footer'>
            <p>© 2026 Zendo · <a href='#'>Privacy Policy</a> · <a href='#'>Terms of Service</a></p>
            <p>Zendo Technology Ltd · Kano, Nigeria</p>
            <div class='email-social'>
                <a href='#'>Twitter</a>
                <a href='#'>LinkedIn</a>
                <a href='#'>Support</a>
            </div>
        </div>

    </div>
</body>

</html>
